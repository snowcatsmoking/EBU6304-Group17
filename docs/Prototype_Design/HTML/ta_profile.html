<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TA Recruitment Management System - Profile</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: #fafafa; color: #333; }

        .topbar {
            background: #fff;
            border-bottom: 1px solid #ddd;
            padding: 14px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .topbar-title { font-size: 15px; font-weight: 600; }
        .topbar-right { font-size: 13px; color: #666; }
        .topbar-right a { color: #333; text-decoration: none; margin-left: 16px; }

        .main { display: flex; max-width: 1080px; margin: 32px auto; gap: 24px; padding: 0 16px; }
        .sidebar { width: 200px; flex-shrink: 0; }
        .content { flex: 1; }

        .nav-item {
            display: block;
            padding: 10px 16px;
            font-size: 14px;
            color: #555;
            text-decoration: none;
            border-left: 3px solid transparent;
        }
        .nav-item.active { color: #000; font-weight: 600; border-left-color: #000; background: #f0f0f0; }

        .card {
            background: #fff;
            border: 1px solid #ddd;
            padding: 24px;
            margin-bottom: 20px;
        }
        .card h2 { font-size: 15px; font-weight: 600; margin-bottom: 20px; }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 32px;
            margin-bottom: 16px;
        }
        .form-row.full { grid-template-columns: 1fr; }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #888;
            margin-bottom: 6px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #ccc;
            font-size: 14px;
            outline: none;
        }
        .form-group textarea { resize: vertical; min-height: 80px; }

        .skill-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 4px;
        }
        .skill-tag {
            padding: 4px 12px;
            font-size: 12px;
            border: 1px solid #ccc;
            background: #f5f5f5;
        }

        .file-upload {
            padding: 20px;
            border: 1px dashed #ccc;
            text-align: center;
            font-size: 13px;
            color: #888;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }
        .btn {
            padding: 9px 24px;
            font-size: 13px;
            border: 1px solid #ccc;
            background: #fff;
            cursor: pointer;
        }
        .btn-primary { background: #000; color: #fff; border-color: #000; }
    </style>
</head>
<body>

<div class="topbar">
    <div class="topbar-title">TA Recruitment Management System</div>
    <div class="topbar-right">
        Alex Zhang (2024001) · Applicant
        <a href="ta_dashboard.html">Back to Dashboard</a>
        <a href="login.html">Log out</a>
    </div>
</div>

<div class="main">
    <div class="sidebar">
        <a class="nav-item" href="ta_dashboard.html">Dashboard</a>
        <a class="nav-item" href="#">Positions</a>
        <a class="nav-item" href="#">My Applications</a>
        <a class="nav-item active" href="#">Profile</a>
    </div>

    <div class="content">

        <!-- Basic info -->
        <div class="card">
            <h2>Basic Information</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" value="Alex Zhang">
                </div>
                <div class="form-group">
                    <label>Student ID</label>
                    <input type="text" value="2024001" disabled style="background:#f5f5f5;">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Major</label>
                    <input type="text" value="Computer Science and Technology">
                </div>
                <div class="form-group">
                    <label>Available Term</label>
                    <select>
                        <option selected>Spring 2026</option>
                        <option>Autumn 2026</option>
                        <option>Spring + Autumn 2026</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" value="138-0000-1234">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="text" value="zhangsan@mail.uic.edu.cn">
                </div>
            </div>
        </div>

        <!-- Skills -->
        <div class="card">
            <h2>Skills</h2>
            <div class="skill-tags">
                <span class="skill-tag">Java</span>
                <span class="skill-tag">Python</span>
                <span class="skill-tag">SQL</span>
                <span class="skill-tag">Git</span>
                <span class="skill-tag">Linux</span>
            </div>
            <div class="form-row full" style="margin-top: 16px;">
                <div class="form-group">
                    <label>Additional Notes</label>
                    <textarea>One semester of TA experience for CSC1001, familiar with tutoring workflows.</textarea>
                </div>
            </div>
        </div>

        <!-- Resume upload -->
        <div class="card">
            <h2>Resume</h2>
            <div class="file-upload">
                Click to upload your resume (.txt / .docx supported)<br>
                <span style="font-size: 12px; color: #aaa;">Uploaded: AlexZhang_Resume.docx</span>
            </div>
        </div>

        <!-- Actions -->
        <div class="actions">
            <button class="btn btn-primary">Save Profile</button>
            <button class="btn">Export as JSON</button>
        </div>

    </div>
</div>

</body>
</html>
