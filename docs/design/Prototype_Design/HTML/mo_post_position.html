<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TA Recruitment Management System - Post Position</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; background: #fafafa; color: #333; }

        .topbar {
            background: #fff;
            border-bottom: 1px solid #ddd;
            padding: 14px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .topbar-title { font-size: 15px; font-weight: 600; }
        .topbar-right { font-size: 13px; color: #666; }
        .topbar-right a { color: #333; text-decoration: none; margin-left: 16px; }

        .main { display: flex; max-width: 1080px; margin: 32px auto; gap: 24px; padding: 0 16px; }
        .sidebar { width: 200px; flex-shrink: 0; }
        .content { flex: 1; }

        .nav-item {
            display: block;
            padding: 10px 16px;
            font-size: 14px;
            color: #555;
            text-decoration: none;
            border-left: 3px solid transparent;
        }
        .nav-item.active { color: #000; font-weight: 600; border-left-color: #000; background: #f0f0f0; }

        .card {
            background: #fff;
            border: 1px solid #ddd;
            padding: 24px;
            margin-bottom: 20px;
        }
        .card h2 { font-size: 15px; font-weight: 600; margin-bottom: 20px; }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 32px;
            margin-bottom: 16px;
        }
        .form-row.full { grid-template-columns: 1fr; }

        .form-group label {
            display: block;
            font-size: 13px;
            color: #888;
            margin-bottom: 6px;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #ccc;
            font-size: 14px;
            outline: none;
        }
        .form-group textarea { resize: vertical; min-height: 100px; }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }
        .btn {
            padding: 9px 24px;
            font-size: 13px;
            border: 1px solid #ccc;
            background: #fff;
            cursor: pointer;
        }
        .btn-primary { background: #000; color: #fff; border-color: #000; }
    </style>
</head>
<body>

<div class="topbar">
    <div class="topbar-title">TA Recruitment Management System</div>
    <div class="topbar-right">
        Prof. Li (MO2001) · Module Organiser
        <a href="mo_dashboard.html">Back to Dashboard</a>
        <a href="login.html">Log out</a>
    </div>
</div>

<div class="main">
    <div class="sidebar">
        <a class="nav-item" href="mo_dashboard.html">Dashboard</a>
        <a class="nav-item" href="#">My Positions</a>
        <a class="nav-item active" href="#">Post Position</a>
        <a class="nav-item" href="#">Applicant Management</a>
        <a class="nav-item" href="#">Position Analytics</a>
    </div>

    <div class="content">

        <div class="card">
            <h2>Basic Position Information</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>Position Title</label>
                    <input type="text" placeholder="e.g. EBU6304 Software Engineering TA">
                </div>
                <div class="form-group">
                    <label>Related Module / Activity</label>
                    <input type="text" placeholder="e.g. EBU6304 Software Engineering">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Openings</label>
                    <input type="number" placeholder="e.g. 3">
                </div>
                <div class="form-group">
                    <label>Application Deadline</label>
                    <input type="date" value="2026-04-30">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>Service Term</label>
                    <select>
                        <option value="">-- Select --</option>
                        <option>Spring 2026</option>
                        <option>Autumn 2026</option>
                        <option>Spring + Autumn 2026</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Position Type</label>
                    <select>
                        <option value="">-- Select --</option>
                        <option>Course TA</option>
                        <option>Lab TA</option>
                        <option>Activity TA</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>Position Requirements</h2>
            <div class="form-row full">
                <div class="form-group">
                    <label>Position Description</label>
                    <textarea placeholder="Please describe the key responsibilities and duties..."></textarea>
                </div>
            </div>
            <div class="form-row full">
                <div class="form-group">
                    <label>Skill Requirements</label>
                    <textarea placeholder="e.g. Proficient in Java and Git; project experience preferred..." style="min-height: 60px;"></textarea>
                </div>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-primary">Publish Position</button>
            <button class="btn">Save Draft</button>
            <button class="btn">Cancel</button>
        </div>

    </div>
</div>

</body>
</html>
