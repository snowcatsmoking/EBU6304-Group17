        --text: rgba(255, 255, 255, 0.92);

        --brand: #7c3aed;
        --good: #22c55e;
        --warn: #f59e0b;
        --bad: #ef4444;

        --shadow: 0 16px 44px rgba(0, 0, 0, 0.45);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        color: var(--text);
        background: radial-gradient(1100px 600px at 15% 0%, rgba(124, 58, 237, 0.3), transparent 55%),

      }
      body.lofi {
        --bg: #ffffff;
        --panel: rgba(17, 24, 39, 0.02);
        --panel2: rgba(17, 24, 39, 0.04);
        --border: rgba(17, 24, 39, 0.16);
        --text: #111827;
        --muted: rgba(17, 24, 39, 0.72);
        --shadow: none;
        background: #ffffff;
        color: #111827;
      }
      body.lofi .topbar {

        background: #ffffff;
      }
      body.lofi .logo {

      }
      body.lofi .panel {

      }
      body.lofi .pill,

      }
      body.lofi .pill strong,

      body.lofi input,
      body.lofi select,
      body.lofi textarea {
        color: #111827;
      }

      }
      body.lofi .topbar {
        border-bottom-color: rgba(17, 24, 39, 0.16);
      }
      body.lofi .panel,
      body.lofi .pill,
      body.lofi .btn,
      body.lofi .tag,
      body.lofi .modal,
      body.lofi .toast {

      }
      body.lofi .modal-backdrop {
        background: rgba(17, 24, 39, 0.2);
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button,
      input,
      select,
      textarea {

      }

        align-items: center;

        gap: 12px;

      .brand {

        align-items: center;
        gap: 10px;
        min-width: 280px;
      }
      .logo {

        color: var(--muted);
        font-size: 12px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .pill strong {

      }
      .btn {

        background: rgba(255, 255, 255, 0.06);
        padding: 9px 12px;
        border-radius: 12px;
        cursor: pointer;
      }

        background: rgba(124, 58, 237, 0.22);
      }

      }

        padding: 16px 16px 64px;
      }
      .panel {
        border: 1px solid var(--border);
        background: var(--panel);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

        border-bottom: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.03);
        display: flex;
        align-items: flex-start;

        font-size: 14px;
        font-weight: 780;
      }

        font-size: 12px;
        color: var(--muted);

        min-width: 0;

      .ph > .tag {

      .row3 .ph {

      }
      .row3 .ph > div {

        min-width: 0;
      }
      .pb {
        padding: 14px;
      }
      .grid {

        grid-template-columns: 1fr;
        gap: 14px;
      }
      .row {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 14px;
        align-items: start;
      }
      .row3 {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 14px;
        align-items: start;
      }
      .muted {
        color: var(--muted);
      }
      .tag {
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 12px;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.03);

        background: rgba(124, 58, 237, 0.18);
        color: var(--brand);
      }

        background: rgba(34, 197, 94, 0.14);
        color: var(--good);
      }
      .tag.warn {

        background: rgba(245, 158, 11, 0.14);
        color: var(--warn);
      }
      .tag.bad {
        border-color: rgba(239, 68, 68, 0.55);
        background: rgba(239, 68, 68, 0.14);

      .nav {

        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
      }
      .nav .left {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .card {

        border-radius: 14px;
        background: rgba(255, 255, 255, 0.04);
        padding: 12px;

      .card .k {

        color: var(--muted);

      .card .v {

        font-size: 18px;
        font-weight: 820;
      }
      .card .h {
        margin-top: 6px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.58);
      }
      .form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;

      .field {
        display: grid;
        gap: 6px;
      }
      .field label {
        font-size: 12px;
        color: var(--muted);

      .field input,
      .field select,
      .field textarea {

        padding: 10px 10px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.18);
        outline: none;
      }
      .field textarea {

        resize: vertical;

      .list {

        gap: 10px;

      .item {
        border: 1px solid var(--border);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.04);
        padding: 12px;
        display: grid;
        gap: 8px;

        font-size: 14px;
        font-weight: 780;

        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .sep {
        height: 1px;
        background: var(--border);
        margin: 12px 0;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;

      .toast {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
        min-width: 280px;
        max-width: 680px;
        padding: 10px 12px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: rgba(10, 16, 30, 0.92);
        box-shadow: var(--shadow);
        display: none;
      }
      .toast.show {
        display: block;
      }
      .toast .t1 {
        font-size: 13px;
        font-weight: 780;
      }
      .toast .t2 {
        margin-top: 4px;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.35;
      }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 18px;
        z-index: 30;
      }
      .modal-backdrop.show {
        display: flex;
      }
      .modal {
        width: min(840px, 100%);
        border-radius: 18px;
        border: 1px solid var(--border);
        background: rgba(10, 16, 30, 0.96);
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .modal .mh {
        padding: 14px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }
      .modal .mh h3 {
        margin: 0;
        font-size: 14px;
        font-weight: 820;
      }
      .modal .mb {
        padding: 14px;
        display: grid;
        gap: 12px;
      }
      @media (max-width: 980px) {
        .row,
        .row3 {
          grid-template-columns: 1fr;
        }
        .cards {
          grid-template-columns: 1fr;
        }
        .form {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

            .value.split(",")
            .map((s) => s.trim())
            .filter(Boolean);
          if (!title) return toastShow("Validation failed", "Title is required.");
          if (!module) return toastShow("Validation failed", "Module is required.");
          if (Number.isNaN(hours) || hours <= 0) return toastShow("Validation failed", "Hours/week must be > 0.");
          if (!deadline) return toastShow("Validation failed", "Deadline is required.");
          if (!required.length) return toastShow("Validation failed", "At least 1 required skill is required.");
          const jobId = `JOB-${Math.floor(5000 + Math.random() * 900)}`;
          state.jobs.unshift({
            jobId,
            title,
            module,
            description: desc || "—",
            hoursPerWeek: hours,
            requiredSkills: required,
            preferredSkills: preferred,
            status: "open",
            deadline
          });
          toastShow("Created", `Job created: ${jobId}.`);
          setHash("/mo/jobs");
        });
      };
      const renderMoJobs = () => {
        rolePill.textContent = "MO";
        app.innerHTML = `
          <div class="grid">
            <div class="panel">
              <div class="ph">
                <div>
                  <h2>Manage Jobs</h2>
                  <p>关闭岗位：停止新申请；历史仍保留。</p>
                </div>
                <span class="tag brand">${state.jobs.length} jobs</span>
              </div>
              <div class="pb">
                ${navBar("mo")}
                <div class="sep"></div>
                <div class="list" id="moJobs"></div>
              </div>
            </div>
          </div>
        `;
        bindNav();
        const list = $("moJobs");
        list.innerHTML = state.jobs
          .map((j) => {
            const count = state.applications.filter((a) => a.jobId === j.jobId).length;
            return `
              <div class="item">
                <div class="top">
                  <div>
                    <h3>${escapeHtml(j.title)}</h3>
                    <div class="meta">
                      <span class="mono">${escapeHtml(j.jobId)}</span>
                      <span>${escapeHtml(j.module)}</span>
                      <span>${j.hoursPerWeek} h/w</span>
                      <span>${count} applications</span>
                    </div>
                  </div>
                  ${tagForStatus(j.status)}
                </div>
                <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;">
                  <button class="btn" data-nav="/mo/applicants/${escapeHtml(j.jobId)}" type="button">Applicants</button>
                  <button class="btn ${j.status === "open" ? "bad" : "good"}" data-toggle="${escapeHtml(j.jobId)}" type="button">${
              j.status === "open" ? "Close job" : "Re-open job"
            }</button>
                </div>
              </div>
            `;
          })
          .join("");
        document.querySelectorAll("button[data-toggle]").forEach((b) => {
          b.addEventListener("click", () => {
            const id = b.getAttribute("data-toggle");
            const job = byId(state.jobs, "jobId", id);
            job.status = job.status === "open" ? "closed" : "open";
            toastShow("Updated", `Job ${id} is now ${job.status}.`);
            renderMoJobs();
          });
        });
      };
      const renderMoApplicants = (jobId) => {
        rolePill.textContent = "MO";
        const jobs = state.jobs.slice();
        const selectedJob = jobId ? byId(state.jobs, "jobId", jobId) : jobs.find((j) => j.status === "open") || jobs[0];
        if (!selectedJob) return renderNotFound("No jobs");
        const apps = state.applications.filter((a) => a.jobId === selectedJob.jobId);
        const ranked = apps
          .map((a) => {
            const person = byId(state.applicants, "applicantId", a.applicantId);
            return { a, person, ex: aiExplain(selectedJob, person) };
          })
          .sort((x, y) => y.ex.score - x.ex.score);
        app.innerHTML = `
          <div class="grid">
            <div class="panel">
              <div class="ph">
                <div>
                  <h2>Applicants</h2>
                  <p>按 AI 匹配排序（可解释），MO 决策必须写备注；决策会同步到 TA 状态。</p>
                </div>
                <span class="tag brand">Ranked</span>
              </div>
              <div class="pb">
                ${navBar("mo")}
                <div class="sep"></div>
                <div class="nav">
                  <div class="left">
                    <span class="pill"><strong>Job</strong> <span class="mono">${escapeHtml(selectedJob.jobId)}</span></span>
                    <span class="pill"><strong>Applicants</strong> ${ranked.length}</span>
                  </div>
                  <div class="left">
                    <button class="btn" id="pickJob" type="button">Select job</button>
                    <button class="btn primary" data-nav="/mo/dashboard" type="button">AI settings</button>
                  </div>
                </div>
                <div class="sep"></div>
                <div class="row">
                  <div class="panel" style="box-shadow:none;">
                    <div class="ph">
                      <div>
                        <h2>${escapeHtml(selectedJob.title)}</h2>
                        <p>Required: ${escapeHtml(selectedJob.requiredSkills.join(", "))}</p>
                      </div>
                      ${tagForStatus(selectedJob.status)}
                    </div>
                    <div class="pb">
                      <div class="list" id="appList"></div>
                    </div>
                  </div>
                  <div class="panel" style="box-shadow:none;">
                    <div class="ph">
                      <div>
                        <h2>Decision rules</h2>
                        <p>通过 Why 解释 + 可覆盖 + 记录理由 来回应 handout 的 AI 使用要求。</p>
                      </div>
                      <span class="tag brand">Traceable</span>
                    </div>
                    <div class="pb muted" style="font-size:12px;line-height:1.5;">
                      操作建议：打开候选人 → 看 Why → 必要时调整权重 → Accept/Reject/Shortlist → 写 decision note → TA 端查看状态变化。
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
        bindNav();
        $("pickJob").addEventListener("click", () => {
          openModal({
            title: "Select job",
            sub: "Choose a job to review applicants",
            bodyHtml: `
              <div class="list">
                ${jobs
                  .map(
                    (j) => `
                      <div class="item">
                        <div class="top">
                          <div>
                            <h3>${escapeHtml(j.title)}</h3>
                            <div class="meta"><span class="mono">${escapeHtml(j.jobId)}</span><span>${escapeHtml(j.module)}</span></div>
                          </div>
                          ${tagForStatus(j.status)}
                        </div>
                        <div style="display:flex;justify-content:flex-end;">
                          <button class="btn primary" data-nav="/mo/applicants/${escapeHtml(j.jobId)}" type="button">Select</button>
                        </div>
                      </div>
                    `
                  )
                  .join("")}
              </div>
            `
          });
          bindModalActions();
        });
        const list = $("appList");
        list.innerHTML = ranked
          .map(({ a, person, ex }) => {
            return `
              <div class="item">
                <div class="top">
                  <div>
                    <h3>${escapeHtml(person.name)} <span class="muted mono" style="font-size:12px;">(${escapeHtml(person.applicantId)})</span></h3>
                    <div class="meta">
                      <span class="mono">${escapeHtml(a.applicationId)}</span>
                      <span>Workload ${workloadHours(person.applicantId)} h/w</span>
                      <span>Updated ${escapeHtml(a.lastUpdatedAt)}</span>
                    </div>
                  </div>
                  <span class="tag brand">Match ${ex.score}/100</span>
                </div>
                <div class="meta">
                  ${tagForStatus(a.status)}
                  <span><strong>Matched required:</strong> ${escapeHtml(ex.matchedRequired.join(", ") || "—")}</span>
                  <span><strong>Missing:</strong> ${escapeHtml(ex.missingRequired.join(", ") || "—")}</span>
                </div>
                <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;">
                  <button class="btn" data-mo-why="${escapeHtml(a.applicationId)}" type="button">Why</button>
                  <button class="btn good" data-decide="${escapeHtml(a.applicationId)}" data-to="Accepted" type="button">Accept</button>
                  <button class="btn" data-decide="${escapeHtml(a.applicationId)}" data-to="Shortlisted" type="button">Shortlist</button>
                  <button class="btn bad" data-decide="${escapeHtml(a.applicationId)}" data-to="Rejected" type="button">Reject</button>
                </div>
              </div>
            `;
          })
          .join("");
        document.querySelectorAll("button[data-mo-why]").forEach((b) => {
          b.addEventListener("click", () => {
            const appId = b.getAttribute("data-mo-why");
            const a = byId(state.applications, "applicationId", appId);
            const person = byId(state.applicants, "applicantId", a.applicantId);
            const ex = aiExplain(selectedJob, person);
            openModal({
              title: `AI Why — ${person.name}`,
              sub: `${selectedJob.jobId} · ${a.applicationId}`,
              bodyHtml: aiExplainHtml(ex, selectedJob)
            });
            bindModalActions();
          });
        });
        document.querySelectorAll("button[data-decide]").forEach((b) => {
          b.addEventListener("click", () => {
            const appId = b.getAttribute("data-decide");
            const to = b.getAttribute("data-to");
            const a = byId(state.applications, "applicationId", appId);
            const person = byId(state.applicants, "applicantId", a.applicantId);
            openModal({
              title: `Decision — ${person.name}`,
              sub: `${selectedJob.jobId} · ${a.applicationId}`,
              bodyHtml: `
                <div class="item">
                  <div class="top">
                    <div>
                      <h3>Set status: ${escapeHtml(to)}</h3>
                      <div class="meta"><span class="mono">${escapeHtml(appId)}</span><span class="mono">${escapeHtml(person.applicantId)}</span></div>
                    </div>
                    ${tagForStatus(to)}
                  </div>
                  <div class="field">
                    <label>Decision note (required for traceability)</label>
                    <textarea id="decisionNote" placeholder="Why this decision? (skills, workload, experience...)"></textarea>
                  </div>
                  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;">
                    <button class="btn" id="cancelDecision" type="button">Cancel</button>
                    <button class="btn primary" id="confirmDecision" type="button">Confirm</button>
                  </div>
                </div>
              `
            });
            $("cancelDecision").addEventListener("click", closeModal);
            $("confirmDecision").addEventListener("click", () => {
              const note = $("decisionNote").value.trim();
              if (!note) return toastShow("Validation failed", "Decision note is required.");
              a.status = to;
              a.decisionBy = state.activeMoId;
              a.decisionNote = note;
              a.lastUpdatedAt = nowIso();
              closeModal();
              toastShow("Updated", `${appId} → ${to} (synced to TA view).`);
              renderMoApplicants(selectedJob.jobId);
            });
          });
        });
      };
      const renderAdminDashboard = () => {
        rolePill.textContent = "Admin";
        const rows = state.applicants
          .map((a) => {
            const h = workloadHours(a.applicantId);
            const status = h > state.settings.maxHoursPerTA ? "bad" : h === state.settings.maxHoursPerTA ? "warn" : "good";
            return { a, h, status };
          })
          .sort((x, y) => y.h - x.h);
        app.innerHTML = `
          <div class="grid">
            <div class="panel">
              <div class="ph">
                <div>
                  <h2>Admin Dashboard</h2>
                  <p>查看 TA 总工作量（基于 Accepted 的岗位小时数）。超过阈值将高亮。</p>
                </div>
                <span class="tag warn">Threshold ${state.settings.maxHoursPerTA} h/w</span>
              </div>
              <div class="pb">
                ${navBar("admin")}
                <div class="sep"></div>
                <div class="cards">
                  <div class="card"><div class="k">TAs</div><div class="v">${state.applicants.length}</div><div class="h">Applicant profiles</div></div>
                  <div class="card"><div class="k">Accepted apps</div><div class="v">${state.applications.filter((a) => a.status === "Accepted").length}</div><div class="h">Affects workload</div></div>
                  <div class="card"><div class="k">Overloaded</div><div class="v">${rows.filter((r) => r.h > state.settings.maxHoursPerTA).length}</div><div class="h">Needs balancing</div></div>
                </div>
                <div class="sep"></div>
                <div class="list">
                  ${rows
                    .map(
                      (r) => `
                        <div class="item">
                          <div class="top">
                            <div>
                              <h3>${escapeHtml(r.a.name)} <span class="muted mono" style="font-size:12px;">(${escapeHtml(r.a.applicantId)})</span></h3>
                              <div class="meta">
                                <span>${escapeHtml(r.a.degree)}</span>
                                <span>Availability ${escapeHtml(String(r.a.availabilityHours))} h/w</span>
                              </div>
                            </div>
                            <span class="tag ${r.status}">${r.h} h/w</span>
                          </div>
                          <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;">
                            <button class="btn primary" data-nav="/admin/balancing" type="button">Balancing</button>
                          </div>
                        </div>
                      `
                    )
                    .join("")}
                </div>
              </div>
            </div>
          </div>
        `;
        bindNav();
      };
      const renderAdminBalancing = () => {
        rolePill.textContent = "Admin";
        const max = state.settings.maxHoursPerTA;
        const overloaded = state.applicants
          .map((a) => ({ a, h: workloadHours(a.applicantId) }))
          .filter((x) => x.h > max)
          .sort((x, y) => y.h - x.h);
        const suggestions = overloaded.map((x) => {
          const candidate = state.applicants
            .map((a) => ({ a, h: workloadHours(a.applicantId) }))
            .filter((y) => y.a.applicantId !== x.a.applicantId)
            .sort((a, b) => a.h - b.h)[0];
          return { from: x, to: candidate };
        });
        app.innerHTML = `
          <div class="grid">
            <div class="panel">
              <div class="ph">
                <div>
                  <h2>Balancing Suggestions (AI)</h2>
                  <p>当某 TA 超载时，给出替代候选人建议，并解释惩罚项来源（阈值与当前工作量）。</p>
                </div>
                <span class="tag brand">Explainable</span>
              </div>
              <div class="pb">
                ${navBar("admin")}
                <div class="sep"></div>
                ${
                  suggestions.length
                    ? `<div class="list">
                        ${suggestions
                          .map(
                            (s, idx) => `
                              <div class="item">
                                <div class="top">
                                  <div>
                                    <h3>Suggestion ${idx + 1}</h3>
                                    <div class="meta">
                                      <span><strong>Overloaded:</strong> ${escapeHtml(s.from.a.name)} (${escapeHtml(
                              s.from.a.applicantId
                            )})</span>
                                      <span><strong>Workload:</strong> ${s.from.h} h/w (threshold ${max})</span>
                                    </div>
                                  </div>
                                  <span class="tag bad">Overload ${s.from.h - max} h</span>
                                </div>
                                <div class="sep"></div>
                                <div class="meta">
                                  <span><strong>Alternative:</strong> ${escapeHtml(s.to.a.name)} (${escapeHtml(s.to.a.applicantId)})</span>
                                  <span><strong>Workload:</strong> ${s.to.h} h/w</span>
                                  <span><strong>Explain:</strong> workloadPenalty = max(0, current - threshold)/threshold</span>
                                </div>
                                <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;">
                                  <button class="btn" data-open-explain="${escapeHtml(s.from.a.applicantId)}" type="button">Why penalize?</button>
                                </div>
                              </div>
                            `
                          )
                          .join("")}
                      </div>`
                    : `<div class="muted" style="font-size:12px;">No overloaded TA right now. You can accept more applicants in MO view to create workload changes.</div>`
                }
              </div>
            </div>
          </div>
        `;
        bindNav();
        document.querySelectorAll("button[data-open-explain]").forEach((b) => {
          b.addEventListener("click", () => {
            const id = b.getAttribute("data-open-explain");
            const h = workloadHours(id);
            const over = Math.max(0, h - max);
            const penalty = over === 0 ? 0 : Math.min(1, over / max);
            openModal({
              title: "Workload penalty explanation",
              sub: `Applicant ${id}`,
              bodyHtml: `
                <div class="item">
                  <h3>Why penalize?</h3>
                  <div class="muted" style="font-size:12px;line-height:1.5;">
                    currentHours = ${h} · threshold = ${max} · overload = ${over}<br/>
                    workloadPenalty = clamp(overload / threshold, 0..1) = ${penalty.toFixed(2)}<br/>
                    This penalty reduces AI score to avoid unfair workload allocation.
                  </div>
                </div>
              `
            });
          });
        });
      };
      const renderNotFound = (msg) => {
        rolePill.textContent = "—";
        app.innerHTML = `
          <div class="panel">
            <div class="ph">
              <div><h2>Not Found</h2><p>${escapeHtml(msg || "Page not found")}</p></div>
              <span class="tag bad">404</span>
            </div>
            <div class="pb" style="display:flex;gap:10px;flex-wrap:wrap;">
              <button class="btn primary" data-nav="/home" type="button">Home</button>
            </div>
          </div>
        `;
        bindNav();
      };
      const render = () => {
        const r = parseHash();
        if (r.role === "home") return renderHome();
        if (r.role === "docs") {
          if (r.view === "overview") return renderDocsOverview();
          if (r.view === "requirements") return renderDocsRequirements();
          if (r.view === "backlog") return renderDocsBacklog();
          if (r.view === "models") return renderDocsModels();
          if (r.view === "tests") return renderDocsTests();
          return renderDocsOverview();
        }
        if (r.role === "ta") {
          if (r.view === "dashboard") return renderTaDashboard();
          if (r.view === "profile") return renderTaProfile();
          if (r.view === "jobs") return renderTaJobs();
          if (r.view === "job") return renderTaJobDetail(r.id);
          if (r.view === "apply") return renderTaApply(r.id);
          if (r.view === "applications") return renderTaApplications();
          if (r.view === "application") return renderTaApplicationDetail(r.id);
          return renderNotFound("TA page");
        }
        if (r.role === "mo") {
          if (r.view === "dashboard") return renderMoDashboard();
          if (r.view === "postjob") return renderMoPostJob();
          if (r.view === "jobs") return renderMoJobs();
          if (r.view === "applicants") return renderMoApplicants(r.id || "");
          return renderNotFound("MO page");
        }
        if (r.role === "admin") {
          if (r.view === "dashboard") return renderAdminDashboard();
          if (r.view === "balancing") return renderAdminBalancing();
          return renderNotFound("Admin page");
        }
        return renderHome();
      };
      const loadData = (raw) => {
        if (!raw || typeof raw !== "object") throw new Error("Invalid JSON object");
        const data = raw.settings || raw.aiWeights || raw.applicants ? raw : raw.data;
        if (!data || typeof data !== "object") throw new Error("Invalid JSON structure");
        if (!Array.isArray(data.applicants) || !Array.isArray(data.jobs) || !Array.isArray(data.applications))
          throw new Error("Missing applicants/jobs/applications arrays");
        state.settings = data.settings && typeof data.settings === "object" ? data.settings : state.settings;
        state.aiWeights = data.aiWeights && typeof data.aiWeights === "object" ? data.aiWeights : state.aiWeights;
        state.applicants = data.applicants;
        state.jobs = data.jobs;
        state.applications = data.applications;
        state.activeApplicantId = data.activeApplicantId || state.activeApplicantId;
        state.activeMoId = data.activeMoId || state.activeMoId;
        state.activeAdminId = data.activeAdminId || state.activeAdminId;
      };
      const exportData = () => {
        const data = {
          settings: state.settings,
          aiWeights: state.aiWeights,
          applicants: state.applicants,
          jobs: state.jobs,
          applications: state.applications,
          exportedAt: nowIso()
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "group017_data_export.json";
        document.body.appendChild(a);
        a.click();
        a.remove();
        toastShow("Exported", "Downloaded group017_data_export.json (simulated text-file storage).");
      };
      exportBtn.addEventListener("click", exportData);
      homeBtn.addEventListener("click", () => setHash("/home"));
      docsBtn.addEventListener("click", () => setHash("/docs/overview"));
      importBtn.addEventListener("click", () => importFile.click());
      importFile.addEventListener("change", async () => {
        const f = importFile.files && importFile.files[0];
        if (!f) return;
        try {
          const text = await f.text();
          const parsed = JSON.parse(text);
          loadData(parsed);
          toastShow("Imported", "Data loaded from JSON (simulated text-file storage).");
          render();
        } catch (e) {
          toastShow("Import failed", String(e && e.message ? e.message : e));
        } finally {
          importFile.value = "";
        }
      });
      lofiBtn.addEventListener("click", () => setLofi(!document.body.classList.contains("lofi")));
      window.addEventListener("hashchange", render);
      setLofi(getLofi());
      if (!location.hash) setHash("/home");
      render();
    </script>
  </body>
</html>
